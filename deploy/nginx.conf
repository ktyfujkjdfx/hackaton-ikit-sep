# ФинКом — один адрес на фронтенд и API.
#
# Фронтенд собран с пустым VITE_API_URL, поэтому в браузере он ходит в /api по тому же
# адресу, с которого отдан. Никакого CORS не нужно: для браузера это один origin.
#
# Перед стартом:
#   cd frontend && npm ci && npm run build      -> появится frontend/dist
#   cd backend  && uvicorn app.main:app --host 127.0.0.1 --port 8000
#
# Проверка конфигурации:  nginx -t -c /etc/nginx/conf.d/fincom.conf
# Перечитать без простоя: nginx -s reload

server {
    listen      80;
    server_name _;

    # Логи нужны, чтобы после демонстрации было видно, что происходило.
    access_log  /var/log/nginx/fincom.access.log;
    error_log   /var/log/nginx/fincom.error.log warn;

    # Путь до собранного фронтенда.
    root  /var/www/fincom;
    index index.html;

    # Одностраничное приложение: любой неизвестный путь отдаём index.html,
    # иначе перезагрузка страницы не на корне вернёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные файлы сборки можно кэшировать надолго — имя меняется при каждой сборке.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, иначе после передеплоя браузер покажет старую версию.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Первый запрос к спящему бэкенду может идти долго — не обрываем его.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # Документация API нужна жюри: она лежит вне /api.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    client_max_body_size 1m;
    gzip                 on;
    gzip_types           text/css application/javascript application/json image/svg+xml;
    gzip_min_length      1024;
}
